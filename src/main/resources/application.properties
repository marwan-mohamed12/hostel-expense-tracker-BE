spring.application.name=hostel-expense-tracker-be

# Activates application-dev.properties (imports gitignored local file). Tests use profile "test" only.
spring.profiles.default=dev

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hibernate/JPA talks to whatever DataSource you configure.
# Default: SQLite. Override in application-local.properties.
spring.datasource.url=jdbc:sqlite:./data/hostel.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

server.port=8080

app.jwt.secret=dev-only-change-me-please-use-a-long-secret-key-32b
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200
app.seed.admin-username=admin
app.seed.admin-password=admin123
app.seed.admin-display-name=Hostel Admin
app.seed.viewer-username=viewer
app.seed.viewer-password=viewer123
app.seed.viewer-display-name=Hostel Viewer
