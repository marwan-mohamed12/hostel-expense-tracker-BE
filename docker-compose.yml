# Optional later. Unused while the app runs on SQLite + Hibernate.
# If you switch: add org.postgresql:postgresql to pom.xml, then
# docker compose up -d and set spring.datasource.url to this Postgres.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hostel_tracker
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel
    ports:
      - "5432:5432"
    volumes:
      - hostel_pg:/var/lib/postgresql/data

volumes:
  hostel_pg:
